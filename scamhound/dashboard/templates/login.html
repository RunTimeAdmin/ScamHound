<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ScamHound</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48.png">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            background: var(--card-bg, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-logo {
            height: 64px;
            width: auto;
            margin-bottom: 1rem;
        }
        .login-card h1 {
            color: var(--text-primary, #fff);
            font-size: 1.75rem;
            margin: 0 0 0.5rem 0;
        }
        .login-card p {
            color: var(--text-secondary, #888);
            margin: 0 0 2rem 0;
            font-size: 0.95rem;
        }
        .btn-google {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: box-shadow 0.2s;
        }
        .btn-google:hover {
            box-shadow: 0 2px 12px rgba(255,255,255,0.1);
        }
        .btn-google img {
            height: 20px;
            width: 20px;
        }
        .login-error {
            color: #f85149;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .login-footer {
            margin-top: 2rem;
            color: var(--text-muted, #666);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img src="/static/favicon-new.png" alt="ScamHound" class="login-logo">
            <h1>ScamHound</h1>
            <p>On-demand rug pull detection for Solana</p>
            <a href="/auth/login/google" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </a>
            <div class="login-error" id="login-error" style="display:none"></div>
            <div class="login-footer">
                Sign in to scan tokens and track your results
            </div>
        </div>
    </div>
    <script>
        // Show error if redirected with error param
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            const el = document.getElementById('login-error');
            el.textContent = 'Authentication failed. Please try again.';
            el.style.display = 'block';
        }
    </script>
</body>
</html>
